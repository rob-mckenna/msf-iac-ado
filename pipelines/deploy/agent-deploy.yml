trigger: none
pr: none

parameters:
- name: project
  type: string
- name: environment
  type: string
  default: sandbox
  values:
  - sandbox
  - poc
  - prod
- name: model_path
  type: string
- name: model_name
  type: string
- name: model_version
  type: string
  default: $(Build.BuildId)
- name: endpoint_name
  type: string
- name: deployment_name
  type: string
  default: blue
- name: agent_config_path
  type: string
- name: test_payload_path
  type: string
  default: ''

variables:
- group: vg-ai-foundry-deploy-common
- group: vg-ai-foundry-deploy-sandbox
- group: vg-ai-foundry-deploy-poc
- group: vg-ai-foundry-deploy-prod
- ${{ if eq(parameters.environment, 'sandbox') }}:
  - name: serviceConnection
    value: $(AI_DEPLOY_SERVICE_CONNECTION_SANDBOX)
  - name: aiFoundryResourceGroup
    value: $(AI_FOUNDRY_RESOURCE_GROUP_SANDBOX)
- ${{ if eq(parameters.environment, 'poc') }}:
  - name: serviceConnection
    value: $(AI_DEPLOY_SERVICE_CONNECTION_POC)
  - name: aiFoundryResourceGroup
    value: $(AI_FOUNDRY_RESOURCE_GROUP_POC)
- ${{ if eq(parameters.environment, 'prod') }}:
  - name: serviceConnection
    value: $(AI_DEPLOY_SERVICE_CONNECTION_PROD)
  - name: aiFoundryResourceGroup
    value: $(AI_FOUNDRY_RESOURCE_GROUP_PROD)

stages:
- stage: validate_package
  displayName: Validate package (${{ parameters.environment }})
  jobs:
  - job: validate_inputs
    displayName: Validate model and deployment assets
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
    - task: PowerShell@2
      displayName: Validate deployment files
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $requiredPaths = @(
            '${{ parameters.model_path }}',
            '${{ parameters.agent_config_path }}'
          )

          foreach ($path in $requiredPaths) {
            $fullPath = Join-Path '$(Build.SourcesDirectory)' $path
            if (-not (Test-Path $fullPath)) {
              throw "Required deployment artifact not found: $fullPath"
            }
          }

- stage: deploy_agent
  displayName: Deploy AI Foundry agent (${{ parameters.environment }})
  dependsOn: validate_package
  jobs:
  - deployment: deploy_agent
    displayName: Register model and deploy endpoint
    environment: ai-agent-${{ parameters.environment }}
    pool:
      vmImage: windows-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Register model and create deployment
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                az config set extension.use_dynamic_install=yes_without_prompt
                az extension add --name ml --yes

                $workspaceName = '${{ parameters.project }}'
                $resourceGroupName = '$(aiFoundryResourceGroup)'
                $modelPath = Join-Path '$(Build.SourcesDirectory)' '${{ parameters.model_path }}'
                $configPath = Join-Path '$(Build.SourcesDirectory)' '${{ parameters.agent_config_path }}'

                az ml workspace show --name $workspaceName --resource-group $resourceGroupName --output table

                $modelId = az ml model create `
                  --name '${{ parameters.model_name }}' `
                  --version '${{ parameters.model_version }}' `
                  --path $modelPath `
                  --resource-group $resourceGroupName `
                  --workspace-name $workspaceName `
                  --query id `
                  --output tsv

                az ml online-endpoint show --name '${{ parameters.endpoint_name }}' --resource-group $resourceGroupName --workspace-name $workspaceName --only-show-errors 1>$null 2>$null
                if ($LASTEXITCODE -ne 0) {
                  az ml online-endpoint create --name '${{ parameters.endpoint_name }}' --auth-mode key --resource-group $resourceGroupName --workspace-name $workspaceName
                }

                az ml online-deployment create `
                  --name '${{ parameters.deployment_name }}' `
                  --endpoint-name '${{ parameters.endpoint_name }}' `
                  --file $configPath `
                  --resource-group $resourceGroupName `
                  --workspace-name $workspaceName `
                  --set model=$modelId tags.environment='${{ parameters.environment }}' tags.artifactType='agent' `
                  --all-traffic

- stage: smoke_test
  displayName: Smoke test agent (${{ parameters.environment }})
  dependsOn: deploy_agent
  jobs:
  - job: verify_endpoint
    displayName: Verify AI Foundry endpoint
    pool:
      vmImage: windows-latest
    steps:
    - task: AzureCLI@2
      displayName: Verify deployment health
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: pscore
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name ml --yes

          $workspaceName = '${{ parameters.project }}'
          $resourceGroupName = '$(aiFoundryResourceGroup)'
          az ml online-endpoint show --name '${{ parameters.endpoint_name }}' --resource-group $resourceGroupName --workspace-name $workspaceName --output table
          az ml online-deployment show --name '${{ parameters.deployment_name }}' --endpoint-name '${{ parameters.endpoint_name }}' --resource-group $resourceGroupName --workspace-name $workspaceName --output table

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.test_payload_path }}')) {
            $requestFile = Join-Path '$(Build.SourcesDirectory)' '${{ parameters.test_payload_path }}'
            az ml online-endpoint invoke --name '${{ parameters.endpoint_name }}' --deployment-name '${{ parameters.deployment_name }}' --resource-group $resourceGroupName --workspace-name $workspaceName --request-file $requestFile | Out-Host
          }