trigger:
  branches:
    include:
    - main
  paths:
    include:
    - pipelines\templates\**
    - pipelines\infra\apim-gateway.yml
    - terraform\compositions\apim-gateway\**
    - terraform\environments\**
    - terraform\modules\**
    - policies\apim-policy\**

pr:
  branches:
    include:
    - main
  paths:
    include:
    - pipelines\templates\**
    - pipelines\infra\apim-gateway.yml
    - terraform\compositions\apim-gateway\**
    - terraform\environments\**
    - terraform\modules\**
    - policies\apim-policy\**

variables:
- group: vg-apim-common
- group: vg-apim-sandbox
- group: vg-apim-poc
- group: vg-apim-prod
- group: vg-tf-backend-sandbox
- group: vg-tf-backend-poc
- group: vg-tf-backend-prod
- name: workingDirectory
  value: terraform\compositions\apim-gateway
- name: landingZoneDependencyCheck
  value: |
    $landingZoneStateStorageAccount = Get-TfvarsValue 'landing_zone_state_storage_account_name'
    $landingZoneStateContainer = Get-TfvarsValue 'landing_zone_state_container_name'
    $landingZoneStateKey = Get-TfvarsValue 'landing_zone_state_key'
    $stateExists = az storage blob exists --auth-mode login --account-name $landingZoneStateStorageAccount --container-name $landingZoneStateContainer --name $landingZoneStateKey --query exists --output tsv
    if ($stateExists -ne 'true') {
      throw "Landing zone dependency is missing. Deploy landing-zone first so remote state $landingZoneStateKey exists."
    }

stages:
- template: ../templates/terraform-validate.yml
  parameters:
    stageName: validate_sandbox
    displayName: Validate (sandbox)
    workingDirectory: $(workingDirectory)
    environment: sandbox
    serviceConnection: $(APIM_SERVICE_CONNECTION_SANDBOX)
    varFile: terraform\environments\sandbox\sandbox.tfvars
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_SANDBOX)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_SANDBOX)
    backendContainer: $(TF_BACKEND_CONTAINER_SANDBOX)
    backendKey: apim-gateway.sandbox.tfstate
    preValidateScript: $(landingZoneDependencyCheck)

- template: ../templates/terraform-plan.yml
  parameters:
    stageName: plan_sandbox
    displayName: Plan (sandbox)
    dependsOn:
    - validate_sandbox
    workingDirectory: $(workingDirectory)
    environment: sandbox
    serviceConnection: $(APIM_SERVICE_CONNECTION_SANDBOX)
    varFile: terraform\environments\sandbox\sandbox.tfvars
    planArtifactName: tfplan-apim-sandbox
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_SANDBOX)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_SANDBOX)
    backendContainer: $(TF_BACKEND_CONTAINER_SANDBOX)
    backendKey: apim-gateway.sandbox.tfstate

- template: ../templates/terraform-apply.yml
  parameters:
    stageName: apply_sandbox
    displayName: Apply (sandbox)
    dependsOn:
    - plan_sandbox
    workingDirectory: $(workingDirectory)
    environment: sandbox
    serviceConnection: $(APIM_SERVICE_CONNECTION_SANDBOX)
    varFile: terraform\environments\sandbox\sandbox.tfvars
    planArtifactName: tfplan-apim-sandbox
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_SANDBOX)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_SANDBOX)
    backendContainer: $(TF_BACKEND_CONTAINER_SANDBOX)
    backendKey: apim-gateway.sandbox.tfstate
    smokeTestScript: |
      $resourceGroupName = Get-TfvarsValue 'resource_group_name'
      $apimName = Get-TfvarsValue 'apim_name'
      if (-not $resourceGroupName -or -not $apimName) {
        throw 'resource_group_name or apim_name was not found in the tfvars file.'
      }
      az apim show --name $apimName --resource-group $resourceGroupName --output table | Out-Host
      'APIM sandbox smoke test completed.' | Set-Content -Path (Join-Path $smokeDir 'apim-smoke.txt') -Encoding utf8

- template: ../templates/terraform-validate.yml
  parameters:
    stageName: validate_poc
    displayName: Validate (poc)
    dependsOn:
    - apply_sandbox
    workingDirectory: $(workingDirectory)
    environment: poc
    serviceConnection: $(APIM_SERVICE_CONNECTION_POC)
    varFile: terraform\environments\poc\poc.tfvars
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_POC)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_POC)
    backendContainer: $(TF_BACKEND_CONTAINER_POC)
    backendKey: apim-gateway.poc.tfstate
    preValidateScript: $(landingZoneDependencyCheck)

- template: ../templates/terraform-plan.yml
  parameters:
    stageName: plan_poc
    displayName: Plan (poc)
    dependsOn:
    - validate_poc
    workingDirectory: $(workingDirectory)
    environment: poc
    serviceConnection: $(APIM_SERVICE_CONNECTION_POC)
    varFile: terraform\environments\poc\poc.tfvars
    planArtifactName: tfplan-apim-poc
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_POC)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_POC)
    backendContainer: $(TF_BACKEND_CONTAINER_POC)
    backendKey: apim-gateway.poc.tfstate

- template: ../templates/terraform-apply.yml
  parameters:
    stageName: apply_poc
    displayName: Apply (poc)
    dependsOn:
    - plan_poc
    workingDirectory: $(workingDirectory)
    environment: poc
    serviceConnection: $(APIM_SERVICE_CONNECTION_POC)
    varFile: terraform\environments\poc\poc.tfvars
    planArtifactName: tfplan-apim-poc
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_POC)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_POC)
    backendContainer: $(TF_BACKEND_CONTAINER_POC)
    backendKey: apim-gateway.poc.tfstate
    requireManualApproval: true
    approvalNotifyUsers: $(APIM_APPROVAL_NOTIFY_USERS_POC)
    approvalInstructions: Confirm landing-zone is already promoted, then review the APIM poc plan and policy changes before apply.
    smokeTestScript: |
      $resourceGroupName = Get-TfvarsValue 'resource_group_name'
      $apimName = Get-TfvarsValue 'apim_name'
      if (-not $resourceGroupName -or -not $apimName) {
        throw 'resource_group_name or apim_name was not found in the tfvars file.'
      }
      az apim show --name $apimName --resource-group $resourceGroupName --output table | Out-Host
      'APIM PoC smoke test completed.' | Set-Content -Path (Join-Path $smokeDir 'apim-smoke.txt') -Encoding utf8

- template: ../templates/terraform-validate.yml
  parameters:
    stageName: validate_prod
    displayName: Validate (prod)
    dependsOn:
    - apply_poc
    workingDirectory: $(workingDirectory)
    environment: prod
    serviceConnection: $(APIM_SERVICE_CONNECTION_PROD)
    varFile: terraform\environments\prod\prod.tfvars
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_PROD)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_PROD)
    backendContainer: $(TF_BACKEND_CONTAINER_PROD)
    backendKey: apim-gateway.prod.tfstate
    preValidateScript: $(landingZoneDependencyCheck)

- template: ../templates/terraform-plan.yml
  parameters:
    stageName: plan_prod
    displayName: Plan (prod)
    dependsOn:
    - validate_prod
    workingDirectory: $(workingDirectory)
    environment: prod
    serviceConnection: $(APIM_SERVICE_CONNECTION_PROD)
    varFile: terraform\environments\prod\prod.tfvars
    planArtifactName: tfplan-apim-prod
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_PROD)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_PROD)
    backendContainer: $(TF_BACKEND_CONTAINER_PROD)
    backendKey: apim-gateway.prod.tfstate

- template: ../templates/terraform-apply.yml
  parameters:
    stageName: apply_prod
    displayName: Apply (prod)
    dependsOn:
    - plan_prod
    workingDirectory: $(workingDirectory)
    environment: prod
    serviceConnection: $(APIM_SERVICE_CONNECTION_PROD)
    varFile: terraform\environments\prod\prod.tfvars
    planArtifactName: tfplan-apim-prod
    backendResourceGroup: $(TF_BACKEND_RESOURCE_GROUP_PROD)
    backendStorageAccount: $(TF_BACKEND_STORAGE_ACCOUNT_PROD)
    backendContainer: $(TF_BACKEND_CONTAINER_PROD)
    backendKey: apim-gateway.prod.tfstate
    requireManualApproval: true
    approvalNotifyUsers: $(APIM_APPROVAL_NOTIFY_USERS_PROD)
    approvalInstructions: Confirm landing-zone production is already promoted, then review APIM production plan, policy impact, and rollback guidance before apply.
    smokeTestScript: |
      $resourceGroupName = Get-TfvarsValue 'resource_group_name'
      $apimName = Get-TfvarsValue 'apim_name'
      if (-not $resourceGroupName -or -not $apimName) {
        throw 'resource_group_name or apim_name was not found in the tfvars file.'
      }
      az apim show --name $apimName --resource-group $resourceGroupName --output table | Out-Host
      'APIM production smoke test completed.' | Set-Content -Path (Join-Path $smokeDir 'apim-smoke.txt') -Encoding utf8